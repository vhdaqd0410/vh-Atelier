<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>vh-Atelier 音效搜索</title>
    <style>
        /* 配色对齐 Excalibur / Adobe 深色面板风格 */
        :root {
            --bg: #232323;
            --border: #313131;
            --font: #9c9c9c;
            --font-idle: #b9b9b9;
            --font-active: #e8e8e8;
            --selected: #454545;
            --highlight: #348EE8;
            --folder: #1d1d1d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--font-idle);
            font-family: "Source Sans Pro", "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: default;
        }

        /* 顶部独立搜索框：透明无边框、大字号，底部一条分隔线 */
        .search-box {
            flex: 0 0 auto;
            padding: 4px 0 0 0;
        }
        .search-box input {
            width: 100%;
            height: 42px;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--font-idle);
            font-family: "Source Sans Pro Semibold", "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 20px;
            padding: 8px 15px 6px;
            border-bottom: 1px solid var(--border);
        }
        .search-box input:focus {
            color: var(--font-active);
            border-bottom-color: var(--highlight);
        }
        .search-box input::placeholder { color: #5a5a5a; }

        /* 结果列表：逐条细分隔线，独立显示在搜索框下方 */
        .results {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .results .empty {
            padding: 30px 15px;
            color: #6a6a6a;
            font-size: 13px;
            line-height: 1.7;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 15px;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            cursor: default;
        }
        .item:hover { background: #2a2a2a; }
        .item.selected {
            background: var(--selected);
            color: var(--font-active);
        }
        .item.selected .nm, .item.selected .ext { color: var(--font-active); }

        .item .playbtn {
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            border: none;
            background: transparent;
            color: var(--font);
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            padding: 0;
            text-align: center;
            border-radius: 3px;
        }
        .item .playbtn:hover { color: var(--font-active); background: #2a2a2a; }

        .item .nm {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--font-idle);
        }
        .item .ext {
            flex: 0 0 auto;
            font-size: 10px;
            color: #6a8fba;
            padding: 1px 6px;
            border-radius: 3px;
            background: #2a2a2a;
        }
        .item .star {
            flex: 0 0 auto;
            cursor: pointer;
            font-size: 15px;
            color: var(--font);
            padding: 0 2px;
        }
        .item .star:hover { color: var(--font-active); }
        .item .star.on { color: #d29922; }

        /* 底部状态 toast：插入成功/失败时闪现 */
        .toast {
            position: absolute;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            max-width: 90%;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 12px;
            background: #1d1d1d;
            border: 1px solid var(--border);
            color: var(--font-idle);
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show { opacity: 1; }
        .toast.ok { border-color: #3fb950; color: #3fb950; }
        .toast.err { border-color: #f85149; color: #f85149; }

        ::-webkit-scrollbar { width: 10px; background: var(--folder); }
        ::-webkit-scrollbar-thumb { border-radius: 20px; background: #3E3E3E; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }
        ::-webkit-scrollbar-corner { background: var(--folder); }
    </style>
</head>
<body>
    <div class="search-box">
        <input id="q" type="text" placeholder="搜索音效..." autocomplete="off" spellcheck="false">
    </div>
    <div class="results" id="results">
        <div class="empty">输入关键词搜索音效</div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="../js/CSInterface.js"></script>
    <script src="./search.js"></script>
</body>
</html>
